<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>PMS — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #1e293b;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .retry-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
      .retry-btn:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="container" role="main">
      <div class="icon" aria-hidden="true">&#128268;</div>
      <h1>You are offline</h1>
      <p>
        No internet connection detected. Your meter readings will be
        queued and synced when you are back online.
      </p>
      <button class="retry-btn" onclick="location.reload()" aria-label="Retry connection">
        Try Again
      </button>
    </div>
  </body>
</html>
